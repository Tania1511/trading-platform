spring:
  application:
    name: surveillance-service

  datasource:
    url: jdbc:postgresql://postgres-surveillance:5432/surveillancedb
    driver-class-name: org.postgresql.Driver
    username: surveillanceapp
    password: surveillance_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration


  kafka:
    bootstrap-servers: kafka:9092

    consumer:
      group-id: surveillance-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.tradingplatform.surveillance_service.event
        spring.json.value.default.type: com.tradingplatform.surveillance_service.event.OrderCanceledEvent
      auto-offset-reset: earliest


server:
  port: 8081


  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        probes:
          enabled: true


  surveillance:
    agent:
      model: claude-sonnet-5
      order-gateway-url: http://order-gateway:8081
      position-service-url: http://position-service:8081

  logging:
    level:
      com.tradingplatform.surveillance_service: DEBUG

spring:
  application:
    name: order-gateway

  datasource:
    url: jdbc:postgresql://postgres:5432/orderdb
    driver-class-name: org.postgresql.Driver
    username: orderapp
    password: orderapp_password

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

#    consumer:
#      group-id: order-gateway-local-consumer
#      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
#      properties:
#        spring.json.trusted-packages: com.tradingPlatform.orderGateway.event
#        spring.json.value.default.type: com.tradingPlatform.orderGateway.event.OrderPlacedEvent
#      auto-offset-reset: earliest

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8081

logging:
  level:
    com.tradingPlatform.orderGateway: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

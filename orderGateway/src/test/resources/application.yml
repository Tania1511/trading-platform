spring:
  application:
    name: order-gateway


  datasource:
    url: jdbc:h2:mem:orderdb_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: "sa"
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.tradingPlatform.orderGateway.event
        spring.json.value.default.type: com.tradingPlatform.orderGateway.event.OrderPlacedEvent
      auto-offset-reset: earliest

  flyway:
    enabled: true
    locations: classpath:/db/migration


logging:
  level:
    com.tradingPlatform.orderGateway: DEBUG
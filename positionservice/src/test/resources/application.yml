spring:
  application:
    name: position-service

  datasource:
    url: jdbc:h2:mem:positiondb_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: "sa"
    password:

  jpa:
    hibernate:
      ddl-auto:validate
    show-sql: true

  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.tradingplatform.positionservice.event
        spring.json.value.default.type: com.tradingplatform.positionservice.event.TradeEvent
      auto-offset-reset: earliest

  flyway:
    enabled: true
    locations: classpath:/db/migration
name: Position Service CI

permissions:
  contents: read
  packages: write


on:
  push:
    branches: [main]
    paths:
      - 'positionservice/**'
      - '.github/workflows/position-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'positionservice/**'
      - '.github/workflows/position-service-ci.yml'

defaults:
  run:
    working-directory: positionservice

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test

      - name: Log in to Github Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image owner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run : |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: positionservice
          push: true
          tags: | 
            ghcr.io/${{ env.IMAGE_OWNER }}/position-service:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/position-service:${{ github.sha }}
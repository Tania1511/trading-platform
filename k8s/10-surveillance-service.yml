apiVersion: apps/v1
kind: Deployment
metadata:
  name: surveillance-service
  namespace: trading-platform

spec:
  replicas: 1
  selector:
    matchLabels:
      app: surveillance-service
  template:
    metadata:
      labels:
        app: surveillance-service
    spec:
      containers:
        - name: surveillance-service
          image: surveillance-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-surveillance-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-surveillance-secret
                  key: POSTGRES_PASSWORD
#            - name: SURVEILLANCE_AGENT_ANTHROPIC_API_KEY
#              valueFrom:
#                secretRef:
#                  name: anthropic-secret
#                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 70
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 10


---

apiVersion: v1
kind: Service
metadata:
  name: surveillance-service
  namespace: trading-platform
spec:
  type: NodePort
  selector:
    app: surveillance-service
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30083
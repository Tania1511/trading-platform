apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: trtading-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apicurio-registry
  template:
    metadata:
      labels:
        app: apicurio-registry
    spec:
      containers:
        - name: apicurio-registry
          image: apicurio/apicurio-registry-mem:latest-release
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-registry
  namespace: trading-platform
spec:
  type: NodePort
  selector:
    app: apicurio-registry
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30091
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: trading-platform
data:
  realm-export.json: |
    {
        "realm" : "trading-platform",
        "enabled": true,
        "sslRequired": "none",
        "registrationAllowed": false,
        "clients": [
            {
                "clientId": "dashboard",
                "publicClient": true,
                "enabled": true,
                "protocol": "openid-connect",
                "redirectUris": ["*"],
                "directAccessGrantsEnabled": true,
                "standardFlowEnabled": false
            },
            {
                "clientId": "surveillance-service",
                "publicClient": false,
                "enabled": true,
                "protocol": "openid-connect",
                "secret": "surveillance-service-secret",
                "serviceAccountsEnabled": true,
                "standardFlowEnabled": false
            }
        ],
        "users": [
            {
                "username": "trader1",
                "enabled": true,
                "credentials": [ 
                    { "type": "password", "value": "trader1234", "temporary": false }
                ]
            }
        ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: trading-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /realms/trading-platform
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: trading-platform
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30084

services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: trading-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderapp
      POSTGRES_PASSWORD: orderapp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U orderapp -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-position:
    image: postgres:16-alpine
    container_name: trading-postgres-position
    environment:
      POSTGRES_DB: positiondb
      POSTGRES_USER: positionapp
      POSTGRES_PASSWORD: positionapp_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_position_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U positionapp -d positiondb"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-gateway:
    build:
      context: ./orderGateway
      dockerfile: Dockerfile
    container_name: order-gateway
    ports:
      - "8081:8081"
    depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_started
        redis:
          condition: service_healthy

  matching-engine:
    build:
      context: ./matching-engine
      dockerfile: Dockerfile
    container_name: matching-engine
    depends_on:
      kafka:
        condition: service_started
      order-gateway:
        condition: service_started

  position-service:
    build:
      context: ./positionservice
      dockerfile: Dockerfile
    container_name: position-service
    depends_on:
      postgres-position:
        condition: service_healthy
      kafka:
        condition: service_started
      matching-engine:
        condition: service_started

volumes:
  postgres_data:
  postgres_position_data: